policy-options {
    prefix-list NOSTRI-V4 {
        198.51.100.0/24;
        203.0.113.0/24;
    }
    prefix-list NOSTRI-V6 {
        2001:db8:c1a5::/48;
    }
    policy-statement ESPORTA-TRANSITO {
        term nostri {
            from prefix-list NOSTRI-V4;
            then accept;
        }
        term nostri-v6 {
            from prefix-list NOSTRI-V6;
            then accept;
        }
        term resto { then reject; }
    }
    policy-statement IMPORTA-TRANSITO {
        term nostri-in-ingresso {
            from prefix-list NOSTRI-V4;
            then reject;
        }
        term troppo-specifici {
            from route-filter 0.0.0.0/0 prefix-length-range /25-/32;
            then reject;
        }
        term resto { then { local-preference 100; accept; } }
    }
}
firewall {
    policer LIMITA-ICMP {
        if-exceeding { bandwidth-limit 1m; burst-size-limit 15k; }
        then discard;
    }
    family inet {
        filter PROTEGGI-RE {
            term gestione {
                from { source-address { 192.0.2.0/26; } protocol tcp; destination-port [ ssh netconf ]; }
                then accept;
            }
            term bgp { from { protocol tcp; port bgp; } then accept; }
            term ntp-e-radius { from { protocol udp; source-port [ ntp radius ]; } then accept; }
            term icmp { from protocol icmp; then { policer LIMITA-ICMP; accept; } }
            term resto { then { syslog; discard; } }
        }
    }
}
