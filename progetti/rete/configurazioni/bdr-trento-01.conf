protocols {
    bgp {
        log-updown;
        group TRANSITO-A {
            type external;
            description "transito-a";
            peer-as 64496;
            import IMPORTA-TRANSITO;
            family inet { unicast { prefix-limit { maximum 1200000; teardown 90 idle-timeout 30; } } }
            export ESPORTA-TRANSITO;
            neighbor 203.0.113.129;
        }
        group TRANSITO-B {
            type external;
            description "transito-b";
            peer-as 64497;
            export ESPORTA-TRANSITO;
            neighbor 203.0.113.133;
        }
        group IBGP {
            type internal;
            local-address 192.0.2.130;
            neighbor 192.0.2.129;
            neighbor 192.0.2.132;
        }
    }
    ospf {
        area 0.0.0.0 {
