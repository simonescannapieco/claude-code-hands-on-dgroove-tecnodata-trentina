; pjsip.conf - centralino cloud multi-cliente di pbx-trento-01

[transport-udp]
type=transport
protocol=udp
bind=192.0.2.32:5060

[endpoint-base](!)
type=endpoint
context=uscite
disallow=all
allow=g722,alaw
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes

[aor-base](!)
type=aor
max_contacts=1
remove_existing=yes
qualify_frequency=60

