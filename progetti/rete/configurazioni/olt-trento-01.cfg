software-version V5.2.1
#
[global-config]
 sysname olt-trento-01
 time zone-name Europe/Rome
 timezone GMT+ 01:00
 time dst start 3-lastSun 02:00:00 end 10-lastSun 03:00:00 adjust 01:00
 ntp-service unicast-server 192.0.2.244
 info-center enable
 info-center loghost 192.0.2.43 facility local5
 info-center loghost source vlanif999
 snmp-agent sys-info version v3
 snmp-agent usm-user v3 monitor authentication-mode sha privacy-mode aes128
 snmp-agent target-host trap address udp-domain 192.0.2.43 params securityname monitor v3 privacy
 snmp-agent sys-info contact noc@ciaspolink.example.org
 snmp-agent sys-info location "POP Trento, sala apparati"
#
[security-config]
 sysman service telnet enable
 sysman service ssh enable
 sysman service http disable
 acl 2000
  rule 5 permit source 192.0.2.0 0.0.0.63
  rule 100 deny
 quit
 sysman firewall ssh acl 2000
 sysman firewall snmp acl 2000
 radius-server template noc
  radius-server authentication 192.0.2.41 1812
  radius-server shared-key cipher %^%#7B2065028578%^%#
 quit
#
[vlan-config]
 vlan 100 smart
 vlan name 100 "pppoe-trento"
 port vlan 100 0/9 0
 vlan 210 smart
 vlan name 210 "biz-trento"
 port vlan 210 0/9 0
 vlan 999 smart
 vlan name 999 "gestione"
 port vlan 999 0/9 0
#
[gpon-config]
 ont-lineprofile gpon profile-id 10 profile-name "casa-ftth"
  tcont 1 dba-profile-id 10
  gem add 1 eth tcont 1
  gem mapping 1 0 vlan 100
  commit
 quit
 ont-lineprofile gpon profile-id 20 profile-name "business-ftth"
  tcont 1 dba-profile-id 20
  gem add 1 eth tcont 1
  gem mapping 1 0 vlan 200
  commit
 quit
 ont-srvprofile gpon profile-id 10 profile-name "router-cliente"
  ont-port eth 1
  port vlan eth 1 translation 100 user-vlan 100
  commit
 quit
