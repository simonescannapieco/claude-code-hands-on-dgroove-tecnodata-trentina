#!KAMAILIO
# kamailio.cfg - SBC SIP di sbc-trento-01 (estratto)

#!define WITH_AUTH
#!define WITH_NAT
#!define DBURL "mysql://kamailio:kamailiorw@pbx-trento-01.ciaspolink.example.org/kamailio"

debug=2
log_stderror=no
log_facility=LOG_LOCAL0
log_prefix="{$mt $hdr(CSeq) $ci} "
children=8
alias="sip.ciaspolink.example.org"
alias="voce.ciaspolink.example.org"
listen=udp:203.0.113.70:5060 advertise 203.0.113.70:5060
listen=tcp:203.0.113.70:5060
listen=tls:203.0.113.70:5061
listen=udp:192.0.2.31:5060
enable_tls=yes
tcp_connection_lifetime=3605

loadmodule "tm.so"
loadmodule "sl.so"
loadmodule "rr.so"
loadmodule "usrloc.so"
loadmodule "registrar.so"
loadmodule "auth.so"
loadmodule "auth_db.so"
loadmodule "dispatcher.so"
loadmodule "nathelper.so"
loadmodule "pike.so"
loadmodule "xlog.so"

modparam("usrloc", "db_url", DBURL)
modparam("usrloc", "db_mode", 2)
modparam("auth_db", "db_url", DBURL)
modparam("auth_db", "calculate_ha1", yes)
modparam("auth_db", "password_column", "password")
modparam("registrar", "max_expires", 3600)
modparam("registrar", "min_expires", 300)
modparam("dispatcher", "list_file", "/etc/kamailio/dispatcher.list")
modparam("dispatcher", "ds_ping_interval", 30)
modparam("dispatcher", "ds_probing_mode", 1)
modparam("dispatcher", "ds_probing_threshold", 2)
modparam("pike", "sampling_time_unit", 2)
modparam("pike", "reqs_density_per_unit", 30)
modparam("nathelper", "natping_interval", 30)

request_route {
	route(REQINIT);
	if (is_method("REGISTER")) {
		if ($rd =~ "\.pbx\.ciaspolink\.example\.org$") {
			# centralino cloud: inoltro al gruppo 1 del dispatcher
			if (!ds_select_dst("1", "4")) {
				sl_send_reply("503", "Service Unavailable");
				exit;
			}
			t_relay();
			exit;
		}
		route(AUTH);
		save("location");
		exit;
	}
	route(RELAY);
}

route[REQINIT] {
	if (!pike_check_req()) { exit; }
	if (!mf_process_maxfwd_header("10")) {
		sl_send_reply("483", "Too Many Hops");
		exit;
	}
}

route[AUTH] {
	if (!auth_check("$fd", "subscriber", "1")) {
		auth_challenge("$fd", "0");
		exit;
	}
}
